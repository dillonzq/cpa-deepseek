name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download SDK host dependencies
        run: go mod download all
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal tests)"
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./internal/...
      - name: Vet
        run: go vet -tags debug ./...
      - name: Native CPA v8 integration
        run: go test -tags debug ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=0.0.0-dev
          if [[ "$REF_TYPE" == tag ]]; then version="${REF_NAME#v}"; fi
          bash scripts/package.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-deepseek-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cpa-deepseek-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages and create checksums
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            "cpa-deepseek-${RELEASE_TAG}-linux-amd64.tar.gz"
            "cpa-deepseek-${RELEASE_TAG}-linux-arm64.tar.gz"
            "cpa-deepseek-${RELEASE_TAG}-darwin-amd64.tar.gz"
            "cpa-deepseek-${RELEASE_TAG}-darwin-arm64.tar.gz"
            "cpa-deepseek-${RELEASE_TAG}-windows-amd64.zip"
          )
          for archive in "${expected[@]}"; do test -s "$archive"; done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes"
          # Never replace assets in an already published release on a rerun.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release is already published"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$notes"
          fi
