name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download SDK host dependencies
        run: go mod download all
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal tests)"
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./internal/...
      - name: Vet
        run: go vet -tags debug ./...
      - name: Native CPA v8 integration
        run: go test -tags debug ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=0.0.0
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${REF_NAME#v}"
          fi
          bash scripts/package.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-deepseek-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cpa-deepseek-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages and create checksums
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected=(
            "cpa-deepseek_${version}_linux_amd64.zip"
            "cpa-deepseek_${version}_linux_arm64.zip"
            "cpa-deepseek_${version}_darwin_amd64.zip"
            "cpa-deepseek_${version}_darwin_arm64.zip"
            "cpa-deepseek_${version}_windows_amd64.zip"
          )
          for archive in "${expected[@]}"; do test -s "$archive"; done
          python3 - "${expected[@]}" <<'PY'
          import pathlib
          import sys
          import zipfile

          extensions = {"linux": ".so", "darwin": ".dylib", "windows": ".dll"}
          for filename in sys.argv[1:]:
              target_os = pathlib.Path(filename).stem.split("_")[-2]
              library = "cpa-deepseek" + extensions[target_os]
              with zipfile.ZipFile(filename) as archive:
                  assert archive.testzip() is None, f"Corrupt zip: {filename}"
                  libraries = []
                  for entry in archive.infolist():
                      path = pathlib.PurePosixPath(entry.filename)
                      assert not path.is_absolute() and ".." not in path.parts and ":" not in entry.filename and "\\" not in entry.filename, f"Unsafe path: {entry.filename}"
                      if path.suffix.lower() in extensions.values():
                          assert not entry.is_dir() and entry.file_size > 0, f"Empty library: {entry.filename}"
                          libraries.append(entry.filename)
                  assert libraries == [library], f"Expected only root library {library}: {libraries}"
          PY
          sha256sum "${expected[@]}" > checksums.txt
          sha256sum --check checksums.txt
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes"
          # Never replace assets in an already published release on a rerun.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release is already published"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$notes"
          fi
